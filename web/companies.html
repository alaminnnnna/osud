<script>
/* No-flash theme bootstrap: runs before first paint. */
(function () {
  try {
    var pref = localStorage.getItem('mdb-theme') || 'system';
    var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.dataset.themePref = pref;
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "MedPrice BD",
  "description": "Medicine price catalogue for Bangladesh — regular and offer prices verified from the public Arogga catalogue.",
  "potentialAction": {
    "@type": "SearchAction",
    "target": { "@type": "EntryPoint", "urlTemplate": "/#/search?q={search_term_string}" },
    "query-input": "required name=search_term_string"
  }
}
</script>
